<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Password Strength Checker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- FIRST PAGE -->
  <div class="container" id="entryPage">
    <h1>AI PASSWORD CHECKER</h1>
    <h2>Enter The Password</h2>
    <p>Enter your password to analyse its strength.</p>

    <input type="password" id="password" placeholder="Enter your password">
    <br>

    <button onclick="togglePassword()">Show / Hide</button>
    <button onclick="checkPassword()">CHECK</button>
  </div>

  <!-- SECOND PAGE -->
  <div class="container" id="resultPage">
    <h1>PASSWORD ANALYSIS</h1>

    <div id="result"></div>
    <div id="percentage"></div>

    <div id="meter">
      <div id="bar"></div>
    </div>

    <div id="suggestions"></div>

    <button onclick="goBack()">BACK</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
